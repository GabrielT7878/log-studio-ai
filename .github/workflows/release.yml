# Publica um release quando uma tag v* é enviada (ex.: `make release V=0.1.1`).
# Gera o instalador NSIS assinado, o .sig e o latest.json que o updater do app lê.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Log Studio AI ${{ github.ref_name }}
          releaseBody: Baixe e rode o instalador `.exe`. Quem já tem o app instalado recebe a atualização pelo próprio app.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
