# Testes e2e: compila o build de testes do app e roda os testes do Playwright (via CDP do
# WebView2) contra o app de verdade. Em caso de falha, publica prints, traces e o relatório.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: e2e
          cache-on-failure: true

      - run: npm ci

      - name: Testes do Rust
        working-directory: src-tauri
        run: cargo test

      - name: Build de testes do app
        run: npm run e2e:build

      - name: Testes e2e
        run: npm run e2e
        env:
          CI: "true"

      - name: Diagnóstico (em caso de falha)
        if: failure()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          "--- processos do app / WebView2"
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -in 'log-studio-ai.exe', 'msedgewebview2.exe' } |
            ForEach-Object { "{0} {1} :: {2}" -f $_.ProcessId, $_.Name, ("$($_.CommandLine)".Substring(0, [Math]::Min(300, "$($_.CommandLine)".Length))) }
          "--- porta 9333"
          netstat -ano | Select-String ':9333'
          "--- WebView2 Runtime"
          Get-ItemProperty 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue | Select-Object pv
          "--- print da tela"
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("test-results/tela-do-runner.png")
          "salvo em test-results/tela-do-runner.png ($($b.Width)x$($b.Height))"

      - name: Resultados (em caso de falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-resultados
          path: |
            test-results/
            playwright-report/
          retention-days: 14
